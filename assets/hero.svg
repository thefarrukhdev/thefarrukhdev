    <circle cx="12" cy="13" r="3.5" fill="#38bdf8"/>
    <text x="24" y="17" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="1">FRONTEND ENGINEER</text>

