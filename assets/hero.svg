    <linearGradient id="cardGlow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="cardGlow2" x1="0" y1="0" x2="1" y2="1">
