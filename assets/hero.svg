    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="url(#headerGrad)">Architecting high-performance web products &amp; modern interfaces.</text>

