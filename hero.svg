<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Animated Blob Gradients -->
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />
    </pattern>

    <style>
      @keyframes float1 {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(40px, -40px) scale(1.1); }
        66% { transform: translate(-20px, 30px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes float2 {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(-40px, 50px) scale(1.2); }
        66% { transform: translate(30px, -30px) scale(0.8); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes float3 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(50px, 20px) scale(1.1); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes fadeText {
        0% { opacity: 0; transform: translateY(15px); filter: blur(4px); }
        100% { opacity: 1; transform: translateY(0); filter: blur(0); }
      }
      .blob1 { animation: float1 15s ease-in-out infinite; }
      .blob2 { animation: float2 18s ease-in-out infinite; }
      .blob3 { animation: float3 20s ease-in-out infinite; }
      
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 56px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -2px;
        animation: fadeText 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 18px;
        font-weight: 500;
        fill: #94a3b8;
        letter-spacing: 4px;
        animation: fadeText 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        opacity: 0;
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />

  <circle cx="20%" cy="30%" r="200" fill="url(#blob1)" class="blob1" />
  <circle cx="80%" cy="70%" r="250" fill="url(#blob2)" class="blob2" />
  <circle cx="50%" cy="50%" r="300" fill="url(#blob3)" class="blob3" />

  <rect width="100%" height="100%" fill="url(#grid)" />

  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" class="text-title">
    FARRUKH <tspan fill="url(#text-grad)">DJUMAYEV</tspan>
  </text>
  <text x="50%" y="62%" dominant-baseline="middle" text-anchor="middle" class="text-subtitle">
    FRONTEND ENGINEER &amp; SOFTWARE ARCHITECT
  </text>
</svg>
